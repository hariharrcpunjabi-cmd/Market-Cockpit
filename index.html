<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Market Cockpit · Weekly · NSE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#10131A; --surface:#171B24; --surface2:#1E2330; --line:#2A2F3C;
    --text:#E7E9EE; --muted:#8A91A0; --faint:#5B6270;
    --good:#3FD69A; --bad:#F1766B; --mid:#EBB94D; --hold:#8B93A3; --gold:#EBB94D; --blue:#5B8DEF;
    --good-dim:rgba(63,214,154,.13); --bad-dim:rgba(241,118,107,.13); --mid-dim:rgba(235,185,77,.12);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%; background:#10131A !important; min-height:100%}
  body{background:#10131A !important; color:var(--text); min-height:100vh; font-family:'Inter',system-ui,sans-serif;
    line-height:1.5; padding:18px 16px 56px; max-width:660px; margin:0 auto; -webkit-font-smoothing:antialiased;}
  .eyebrow{font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--gold); margin-bottom:6px}
  h1{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:28px; letter-spacing:-.02em; line-height:1.05}
  .updated{font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--muted); margin-top:5px}

  .summary{margin:16px 0 14px; border:1px solid var(--line); border-radius:12px; background:var(--surface2); padding:12px 15px;
    font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--text); line-height:1.7}
  .summary .k{color:var(--muted)}
  .summary b.on,.summary b.strong{color:var(--good)} .summary b.off,.summary b.weak{color:var(--bad)}
  .summary b.mid,.summary b.neutral,.summary b.sideways{color:var(--mid)}

  .tabs{display:flex; gap:6px; margin-bottom:18px; overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:2px}
  .tabs button{font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:.03em; white-space:nowrap;
    background:var(--surface); color:var(--muted); border:1px solid var(--line); padding:9px 14px; border-radius:99px; cursor:pointer; display:flex; align-items:center; gap:5px}
  .tabs button.active{color:var(--ink); background:var(--gold); border-color:var(--gold); font-weight:600}
  .tabs button .lock{font-size:9px; opacity:.7}
  .panel{display:none} .panel.active{display:block; animation:fade .25s ease}
  @keyframes fade{from{opacity:0; transform:translateY(4px)}to{opacity:1; transform:none}}
  .shead{font-family:'Space Grotesk',sans-serif; font-size:20px; font-weight:600; letter-spacing:-.01em; margin:0 2px 6px}
  .personal-tag{display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:9px; letter-spacing:.1em; text-transform:uppercase; color:var(--gold); background:var(--mid-dim); padding:3px 8px; border-radius:99px; margin-left:8px; vertical-align:middle}
  .lead{font-size:12.5px; color:var(--muted); margin:8px 2px 14px; line-height:1.5}

  .verdict{border:1px solid var(--line); border-radius:14px; overflow:hidden; background:var(--surface); margin-bottom:12px}
  .verdict .bar{height:4px; width:100%}
  .verdict.on .bar,.verdict.strong .bar{background:var(--good)} .verdict.off .bar,.verdict.weak .bar{background:var(--bad)} .verdict.neutral .bar,.verdict.sideways .bar{background:var(--mid)}
  .verdict .body{padding:16px 18px}
  .verdict .label{font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--muted)}
  .verdict .big{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:25px; margin-top:2px}
  .verdict.on .big,.verdict.strong .big{color:var(--good)} .verdict.off .big,.verdict.weak .big{color:var(--bad)} .verdict.neutral .big,.verdict.sideways .big{color:var(--mid)}
  .verdict .action{font-size:13.5px; color:var(--text); margin-top:9px; line-height:1.5}
  .verdict .meta{display:flex; gap:16px; margin-top:9px; flex-wrap:wrap; font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--muted)}
  .verdict .meta b{color:var(--text); font-weight:600}

  .card{border:1px solid var(--line); border-left-width:3px; border-radius:12px; padding:14px 16px; margin-bottom:9px; background:var(--surface)}
  .card.good{border-left-color:var(--good)} .card.mid{border-left-color:var(--mid)} .card.bad{border-left-color:var(--bad)}
  .card .top{display:flex; justify-content:space-between; align-items:center; gap:10px}
  .card .cname{font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:15px}
  .card .num{font-family:'IBM Plex Mono',monospace; font-size:16px; font-weight:600; display:flex; align-items:center; gap:6px; white-space:nowrap}
  .arrow{font-size:12px} .arrow.up{color:var(--good)} .arrow.down{color:var(--bad)} .arrow.flat{color:var(--muted)}
  .plain{font-size:13px; color:var(--text); line-height:1.5; margin-top:5px}
  .ctx{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--gold); margin-top:7px; line-height:1.4}
  .why{font-size:11px; color:var(--faint); margin-top:6px; line-height:1.45}
  .pill{display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; padding:3px 8px; border-radius:99px; margin-top:9px}
  .pill.good{color:var(--good); background:var(--good-dim)} .pill.mid{color:var(--mid); background:var(--mid-dim)} .pill.bad{color:var(--bad); background:var(--bad-dim)}

  .row{display:grid; grid-template-columns:32px 1fr auto; align-items:center; gap:12px; padding:12px 14px; border:1px solid var(--line); border-radius:12px; margin-bottom:8px; background:var(--surface)}
  .rank{font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:19px; color:var(--faint); text-align:right}
  .row.ow .rank{color:var(--good)} .row.av .rank{color:var(--bad)}
  .rname{font-family:'Space Grotesk',sans-serif; font-weight:500; font-size:15px; display:flex; align-items:center; gap:7px; flex-wrap:wrap}
  .px{font-family:'IBM Plex Mono',monospace; font-size:9px; color:var(--faint); border:1px solid var(--line); border-radius:4px; padding:1px 4px; text-transform:uppercase}
  .track{height:5px; background:var(--surface2); border-radius:99px; margin-top:7px; overflow:hidden}
  .fill{height:100%; border-radius:99px}
  .row.ow .fill{background:var(--good)} .row.av .fill{background:var(--bad)} .row:not(.ow):not(.av) .fill{background:var(--hold)}
  .zr{font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--faint); margin-top:6px} .zr b{color:var(--muted); font-weight:500}
  .tag{font-family:'IBM Plex Mono',monospace; font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; padding:5px 9px; border-radius:99px; white-space:nowrap; border:1px solid var(--line); color:var(--muted)}
  .tag.ow{color:var(--good); background:var(--good-dim); border-color:transparent} .tag.av{color:var(--bad); background:var(--bad-dim); border-color:transparent} .tag.watch{color:var(--mid); background:var(--mid-dim); border-color:transparent}

  .dwrap{display:flex; gap:18px; flex-wrap:wrap; margin-bottom:14px}
  .donutcard{flex:1; min-width:150px; border:1px solid var(--line); border-radius:14px; background:var(--surface); padding:16px}
  .donutcard h3{font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-bottom:12px}
  .donutrow{display:flex; align-items:center; gap:14px}
  .donut{width:96px; height:96px; border-radius:50%; position:relative; flex-shrink:0}
  .donut::after{content:''; position:absolute; inset:26%; border-radius:50%; background:var(--surface)}
  .dlegend{font-family:'IBM Plex Mono',monospace; font-size:11.5px; line-height:1.9}
  .dlegend .dot{display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:7px; vertical-align:middle}
  .dlegend b{color:var(--text)} .dlegend span{color:var(--muted)}

  .gradebar{display:flex; gap:7px; margin:0 2px 14px; flex-wrap:wrap}
  .gradebar span{font-family:'IBM Plex Mono',monospace; font-size:11px; padding:5px 11px; border-radius:99px; border:1px solid var(--line)}
  .gradebar .g-good{color:var(--good)} .gradebar .g-mid{color:var(--mid)} .gradebar .g-bad{color:var(--bad)}
  .tierbadge{font-family:'IBM Plex Mono',monospace; font-size:9px; letter-spacing:.06em; text-transform:uppercase; padding:2px 7px; border-radius:4px; border:1px solid var(--line); color:var(--muted); margin-left:2px}

  .stock{border:1px solid var(--line); border-left-width:3px; border-radius:12px; padding:13px 16px; margin-bottom:9px; background:var(--surface)}
  .stock.clean{border-left-color:var(--good)} .stock.watch{border-left-color:var(--mid)} .stock.ext{border-left-color:var(--bad)}
  .stock .st-top{display:flex; align-items:center; gap:9px; flex-wrap:wrap}
  .stock .srank{font-family:'IBM Plex Mono',monospace; font-size:14px; color:var(--faint); font-weight:600; min-width:22px}
  .stock .ssym{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:17px; letter-spacing:-.01em}
  .stock .sclose{margin-left:auto; font-family:'IBM Plex Mono',monospace; font-size:15px; font-weight:600}
  .stock .sname{font-size:12px; color:var(--muted); margin-top:3px}
  .stock .gpill{font-family:'IBM Plex Mono',monospace; font-size:9.5px; letter-spacing:.08em; text-transform:uppercase; padding:3px 8px; border-radius:99px}
  .stock .gpill.good{color:var(--good); background:var(--good-dim)} .stock .gpill.mid{color:var(--mid); background:var(--mid-dim)} .stock .gpill.bad{color:var(--bad); background:var(--bad-dim)}
  .stock .chase{font-family:'IBM Plex Mono',monospace; font-size:9px; letter-spacing:.08em; text-transform:uppercase; color:var(--bad); background:var(--bad-dim); padding:3px 8px; border-radius:99px}
  .stock .hv{font-family:'IBM Plex Mono',monospace; font-size:9px; letter-spacing:.06em; color:var(--gold); background:var(--mid-dim); padding:3px 8px; border-radius:99px}
  .stock .stats{display:flex; gap:15px; flex-wrap:wrap; margin-top:9px; font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--muted)}
  .stock .stats b{color:var(--text); font-weight:600} .stock .stats .mcap{color:var(--faint)}
  .stock .stops{font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--muted); margin-top:9px; padding-top:9px; border-top:1px solid var(--surface2); line-height:1.8}
  .stock .stops b{color:var(--muted)} .stock .stops .sug{color:var(--good); font-weight:600}
  .stock .qty{color:var(--good); font-weight:600; font-size:11px}
  .stock .slhead{font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--faint); margin-bottom:6px}
  .stock .slrow{display:flex; align-items:center; gap:9px; font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--text); margin:3px 0}
  .stock .slrow b{color:var(--text); font-weight:600; min-width:64px}
  .stock .sllabel{color:var(--muted); min-width:52px; font-size:11px}
  .stock .slpct{color:var(--bad); min-width:42px}
  .stock .slbar{flex:0 0 70px; height:5px; background:var(--surface2); border-radius:99px; overflow:hidden}
  .stock .slbar i{display:block; height:100%; background:var(--bad); border-radius:99px; opacity:.65}

  .stock .stopmain{color:var(--text)} .stock .stopmain b{color:var(--text)}
  .stock .stoptype{color:var(--faint); font-size:10px; margin-left:3px}
  .stock .stopalt{color:var(--faint); margin-top:5px}
  .stock .s2exit{display:block; font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--faint); margin-top:6px}
  .stock .watchline{font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--muted); margin-top:8px}
  .stock .fund{font-size:12.5px; color:var(--text); background:var(--mid-dim); border-radius:8px; padding:8px 11px; margin-top:8px; line-height:1.45}
  .agebadge{font-family:'IBM Plex Mono',monospace; font-size:9.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--gold); background:var(--mid-dim); padding:3px 8px; border-radius:99px}
  .newbadge{font-family:'IBM Plex Mono',monospace; font-size:9px; letter-spacing:.06em; text-transform:uppercase; color:var(--good); background:var(--good-dim); padding:3px 8px; border-radius:99px}
  .exitbadge{font-family:'IBM Plex Mono',monospace; font-size:9px; letter-spacing:.06em; text-transform:uppercase; color:var(--bad); background:var(--bad-dim); padding:3px 8px; border-radius:99px}
  .ret{font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:14px} .ret.pos{color:var(--good)} .ret.neg{color:var(--bad)}
  .introhero .ih-title{font-family:'Space Grotesk',sans-serif; font-size:22px; font-weight:700; margin-bottom:8px}
  .introhero p{font-size:14px; color:var(--muted); line-height:1.6; margin-bottom:18px}
  .step{display:flex; gap:14px; align-items:flex-start; border:1px solid var(--line); border-radius:12px; background:var(--surface); padding:14px 16px; margin-bottom:10px}
  .stepn{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:17px; color:var(--ink); background:var(--gold); width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0}
  .step b{color:var(--text); font-size:14px} .step p{font-size:13px; color:var(--muted); line-height:1.5; margin-top:3px} .step em{color:var(--gold); font-style:normal; font-weight:600}
  .introhd{font-family:'Space Grotesk',sans-serif; font-size:16px; font-weight:600; margin:22px 2px 12px}
  .rule{font-size:13.5px; color:var(--text); line-height:1.55; border:1px solid var(--line); border-radius:10px; background:var(--surface); padding:11px 14px; margin-bottom:8px}
  .rcard{border:1px solid var(--line); border-radius:12px; background:var(--surface); padding:14px 16px}
  .rcard p{font-size:13px; color:var(--muted); line-height:1.55; margin-bottom:9px} .rcard p:last-child{margin-bottom:0} .rcard b{color:var(--text)}
  .introfoot{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--faint); line-height:1.6; margin-top:20px; padding-top:14px; border-top:1px solid var(--line)}
  .rrg{width:100%; height:auto; display:block; background:var(--surface); border:1px solid var(--line); border-radius:14px; margin-bottom:12px}
  .rrgrow{display:flex; align-items:center; gap:9px; font-family:'IBM Plex Mono',monospace; font-size:12px; padding:8px 2px; border-bottom:1px solid var(--surface2)}
  .rrgrow b{color:var(--text); font-weight:600; min-width:120px} .rrgrow:last-child{border:0}
  .qdot{width:9px; height:9px; border-radius:50%; flex-shrink:0}
  .rq{color:var(--muted)} .rr{margin-left:auto; color:var(--faint)}


  .tierhd{font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:18px 2px 10px} .tierhd b{color:var(--gold); font-weight:600}
  details.more{margin-top:8px} details.more>summary{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--muted); cursor:pointer; padding:11px 2px; list-style:none} details.more>summary::-webkit-details-marker{display:none}
  .riskbox{border:1px solid var(--line); border-radius:12px; background:var(--surface); padding:12px 15px; margin-bottom:12px}
  .riskbox label{display:block; font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin-bottom:8px}
  .riskbox input{width:100%; background:var(--surface2); border:1px solid var(--line); border-radius:8px; padding:10px 12px; color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:14px}
  .riskbox input:focus{outline:2px solid var(--gold); outline-offset:1px}
  .empty{border:1px dashed var(--line); border-radius:12px; padding:24px 20px; text-align:center; color:var(--muted); font-size:13px; line-height:1.6}
  .empty b{color:var(--text)}
  .miss{border:1px dashed var(--line); border-radius:12px; padding:20px; text-align:center; color:var(--muted); font-size:13px}
  .state{text-align:center; padding:56px 20px; color:var(--muted); font-size:14px}
  .spinner{width:26px; height:26px; border:2px solid var(--line); border-top-color:var(--gold); border-radius:50%; margin:0 auto 16px; animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  footer{margin-top:30px; font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--faint); line-height:1.6; text-align:center}
</style>
</head>
<body>
  <header>
    <div class="eyebrow">Weekly · NSE · self-updating</div>
    <h1>Market Cockpit</h1>
    <div class="updated" id="updated">Loading…</div>
  </header>
  <div id="app"><div class="state"><div class="spinner"></div>Loading the cockpit…</div></div>
  <footer>WCB = weekly close below · CMP = current market price · stops on a weekly-closing basis<br>
    Holding 15 days–3 months · book partial &amp; move SL to entry at Target 1<br>Educational only · not SEBI-registered · updated weekly</footer>

<script>
const fmtDate = s => { try{ return new Date(s).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});}catch(e){return s;} };
const PILL = {good:'Supportive', mid:'Neutral', bad:'Caution'};
const inr = n => (n==null||isNaN(n)) ? '—' : '₹' + Number(n).toLocaleString('en-IN');
async function J(u){ const r=await fetch(u+'?t='+Date.now(),{cache:'no-store'}); if(!r.ok) throw 0; return r.json(); }

async function load(){
  const app=document.getElementById('app');
  app.innerHTML=`<div class="state"><div class="spinner"></div>Loading the cockpit…</div>`;
  const [m,s,t]=await Promise.allSettled([J('./macro.json'),J('./data.json'),J('./stage2.json')]);
  render(m.status==='fulfilled'?m.value:null, s.status==='fulfilled'?s.value:null, t.status==='fulfilled'?t.value:null);
}

function donut(segs){
  const total=segs.reduce((a,b)=>a+b.value,0)||1; let acc=0,stops=[];
  segs.forEach(g=>{const from=acc/total*100; acc+=g.value; const to=acc/total*100; stops.push(`${g.color} ${from}% ${to}%`);});
  const legend=segs.map(g=>`<div><span class="dot" style="background:${g.color}"></span><b>${g.label}</b> <span>${g.value}</span></div>`).join('');
  return `<div class="donutrow"><div class="donut" style="background:conic-gradient(${stops.join(',')})"></div><div class="dlegend">${legend}</div></div>`;
}
function sigCard(s){
  const ar=s.arrow==='up'?'▲':s.arrow==='down'?'▼':'→';
  return `<div class="card ${s.status}"><div class="top"><div class="cname">${s.name}</div>
    <div class="num">${s.headline} <span class="arrow ${s.arrow}">${ar}</span></div></div>
    <div class="plain">${s.plain}</div>${s.context?`<div class="ctx">${s.context}</div>`:''}
    <div class="why">${s.why}</div><span class="pill ${s.status}">${PILL[s.status]}</span></div>`;
}

// full BUY card (Trading, Momentum)
function buyCard(x, isMomentum){
  const gp={Prime:'good',Healthy:'mid',Late:'bad'}, gmap={Prime:'clean',Healthy:'watch',Late:'ext'};
  const cls=gmap[x.grade]||'watch';
  const chase = isMomentum && x.grade==='Late' ? `<span class="chase">chase risk</span>` : '';
  const stat=[];
  if(x.mcap_cr!=null) stat.push(`<span class="mcap">\u20b9${Number(x.mcap_cr).toLocaleString('en-IN')} Cr</span>`);
  if(x.pct_change!=null) stat.push(`${x.pct_change>=0?'+':''}${x.pct_change}% today`);
  stat.push(`+${x.ext_above_30wma}% vs MA`);
  // three stops, sorted tight->wide, logic hidden
  const trip=[[x.stop_ma,x.risk_ma],[x.stop_atr,x.risk_atr],[x.stop_ema,x.risk_ema]].filter(s=>s[0]!=null && s[1]>0).sort((a,b)=>a[1]-b[1]);
  const lbl=['Tight','Medium','Wide'];
  const maxR=Math.max(...trip.map(s=>s[1]),1);
  const slrows=trip.map((s,i)=>`<div class="slrow"><span class="sllabel">${lbl[i]||''}</span><b>${inr(s[0])}</b><span class="slpct">\u2212${s[1]}%</span><span class="slbar"><i style="width:${Math.round(s[1]/maxR*100)}%"></i></span><span class="qty" data-rps="${(x.close-s[0]).toFixed(2)}"></span></div>`).join('');
  return `<div class="stock ${cls}">
    <div class="st-top"><div class="srank">${String(x.rank).padStart(2,'0')}</div>
      <div class="ssym">${x.symbol}</div>
      <span class="gpill ${gp[x.grade]}">${x.grade}</span>${chase}
      ${x.tier&&x.tier!=='\u2014'?`<span class="tierbadge">${x.tier}</span>`:''}
      ${x.sector?`<span class="tierbadge">${x.sector}</span>`:''}
      <div class="sclose">${inr(x.close)}</div></div>
    ${x.name?`<div class="sname">${x.name}</div>`:''}
    ${x.fundamental?`<div class="fund">\ud83d\udca1 ${x.fundamental}</div>`:''}
    <div class="stats">${stat.map(z=>`<span>${z}</span>`).join('')}</div>
    <div class="stops"><div class="slhead">Stop-loss options (pick your risk)</div>${slrows}
      <div class="s2exit">Full exit if weekly close below ${inr(x.stage2_exit)} (WCB)</div></div></div>`;
}

// light WATCHLIST card (Accumulation, Kissing-MA)
function watchCard(x){
  const hv=[]; if(x.hve) hv.push('⚡ HVE (highest vol ever)'); else if(x.hva) hv.push('⚡ HVA (highest vol ~6mo)');
  return `<div class="stock watch">
    <div class="st-top"><div class="ssym">${x.symbol}</div>
      ${x.tier&&x.tier!=='—'?`<span class="tierbadge">${x.tier}</span>`:''}
      ${x.sector?`<span class="tierbadge">${x.sector}</span>`:''}
      ${hv.length?`<span class="hv">${hv[0]}</span>`:''}
      <div class="sclose">${inr(x.close)}</div></div>
    ${x.name?`<div class="sname">${x.name}</div>`:''}
    <div class="watchline">Basing +${x.ext_above_30wma}% above 150-MA · watch for breakout into the buy list</div></div>`;
}

function scannerPanel(sc){
  if(!sc || !sc.qualified){
    return `<div class="empty">${sc&&sc.note?sc.note:'No names this week.'}<br><br><b>Nothing here right now — in a strong market, that's normal.</b></div>`;
  }
  const g=sc.grades||{};
  const gbar=g.Prime!=null?`<div class="gradebar"><span class="g-good">Prime ${g.Prime}</span><span class="g-mid">Healthy ${g.Healthy}</span><span class="g-bad">Late ${g.Late}</span></div>`:'';
  if(sc.style==='watch'){
    return `<div class="lead">${sc.note}</div>`+sc.stocks.map(watchCard).join('');
  }
  // buy style: risk box + focused tiers (drop Late, cap 15)
  const isMom = sc.label==='Momentum';
  const riskbox=`<div class="riskbox"><label>Risk per trade (₹) — optional, shows quantity at each stop</label><input class="riskInput" type="number" inputmode="numeric" placeholder="e.g. 2000"></div>`;
  const clean=(sc.stocks||[]).filter(x=>x&&x.symbol&&x.grade!=='Late');
  const lateN=(sc.stocks||[]).filter(x=>x&&x.symbol&&x.grade==='Late').length;
  const top5=clean.slice(0,5), next=clean.slice(5,15), rest=clean.slice(15);
  const grp=(title,sub,arr)=> arr.length?`<div class="tierhd"><b>${title}</b> ${sub}</div>`+arr.map(x=>buyCard(x,isMom)).join(''):'';
  const excl=lateN?`<div class="note">${lateN} extended / below-MA name${lateN>1?'s':''} hidden — too stretched to buy safely.</div>`:'';
  return `<div class="lead">${sc.note}</div>`+gbar+riskbox
    + grp('Top 5','highest conviction — best risk/reward', top5)
    + grp('6–15','strong follow-ups', next)
    + (rest.length?`<details class="more"><summary>More · ${rest.length} additional Prime/Healthy names ▾</summary>${rest.map(x=>buyCard(x,isMom)).join('')}</details>`:'')
    + excl
    + `<div class="note">Three stop-loss options per name, tight to wide — pick your comfort. Enter risk-per-trade above to size each.</div>`;
}


function trackerPanel(tr){
  if(!tr || !tr.stocks || !tr.stocks.length) return `<div class="empty">The Tracker fills in once the buy list has run at least once.</div>`;
  const note = tr.first_run
    ? `<div class="lead">Aging starts now — every name is a <b>Fresh</b> entry this week. From next week, names that stay on the list become Week 1, Week 2\u2026 so you can see how long each has held Stage 2.</div>`
    : `<div class="lead">How long each buy-list name has held Stage 2, newest and dropped names, and return since first seen.</div>`;
  const cards = tr.stocks.map(s=>{
    const badges=[`<span class="agebadge">${s.age}</span>`];
    if(s.new) badges.push(`<span class="newbadge">New</span>`);
    if(s.sl_hit) badges.push(`<span class="exitbadge">SL hit \u00b7 exit</span>`);
    const ret = s.ret_pct!=null ? `<span class="ret ${s.ret_pct>=0?'pos':'neg'}">${s.ret_pct>=0?'+':''}${s.ret_pct}%</span>` : '';
    return `<div class="stock ${s.sl_hit?'ext':'clean'}">
      <div class="st-top"><div class="ssym">${s.symbol}</div>${badges.join('')}<div class="sclose">${ret}</div></div>
      ${s.name?`<div class="sname">${s.name}${s.sector?' \u00b7 '+s.sector:''}</div>`:''}</div>`;
  }).join('');
  const dropped = (tr.dropped && tr.dropped.length)
    ? `<div class="tierhd"><b>Dropped this week</b></div><div class="lead">${tr.dropped.join(', ')} \u2014 fell off the buy list.</div>` : '';
  return note + cards + dropped;
}

function rrgPanel(rrg){
  if(!rrg || !rrg.sectors || !rrg.sectors.length) return `<div class="miss">RRG data unavailable.</div>`;
  const secs=rrg.sectors;
  let dev=1.5; secs.forEach(s=>s.trail.forEach(p=>{dev=Math.max(dev,Math.abs(p[0]-100),Math.abs(p[1]-100));}));
  dev=dev*1.25; const lo=100-dev, hi=100+dev, W=340,H=360,pad=40;
  const sx=v=>pad+(v-lo)/(hi-lo)*(W-2*pad);
  const sy=v=>H-pad-(v-lo)/(hi-lo)*(H-2*pad);
  const qcol={Leading:'#3FD69A',Weakening:'#EBB94D',Lagging:'#F1766B',Improving:'#5B8DEF'};
  const cx=sx(100), cy=sy(100);
  let svg=`<svg viewBox="0 0 ${W} ${H}" class="rrg">`;
  svg+=`<rect x="${cx}" y="${pad}" width="${W-pad-cx}" height="${cy-pad}" fill="rgba(63,214,154,.06)"/>`;
  svg+=`<rect x="${cx}" y="${cy}" width="${W-pad-cx}" height="${H-pad-cy}" fill="rgba(235,185,77,.06)"/>`;
  svg+=`<rect x="${pad}" y="${cy}" width="${cx-pad}" height="${H-pad-cy}" fill="rgba(241,118,107,.06)"/>`;
  svg+=`<rect x="${pad}" y="${pad}" width="${cx-pad}" height="${cy-pad}" fill="rgba(91,141,239,.06)"/>`;
  svg+=`<line x1="${cx}" y1="${pad}" x2="${cx}" y2="${H-pad}" stroke="#2A2F3C"/>`;
  svg+=`<line x1="${pad}" y1="${cy}" x2="${W-pad}" y2="${cy}" stroke="#2A2F3C"/>`;
  svg+=`<text x="${W-pad-3}" y="${pad+11}" font-size="9" fill="#3FD69A" text-anchor="end">LEADING</text>`;
  svg+=`<text x="${W-pad-3}" y="${H-pad-6}" font-size="9" fill="#EBB94D" text-anchor="end">WEAKENING</text>`;
  svg+=`<text x="${pad+3}" y="${H-pad-6}" font-size="9" fill="#F1766B">LAGGING</text>`;
  svg+=`<text x="${pad+3}" y="${pad+11}" font-size="9" fill="#5B8DEF">IMPROVING</text>`;
  svg+=`<text x="${(W/2).toFixed(0)}" y="${H-8}" font-size="8" fill="#5B6270" text-anchor="middle">\u2190 weaker   RS vs benchmark   stronger \u2192</text>`;
  // hidden trails (revealed on tap)
  secs.forEach((s,i)=>{ const pts=s.trail.map(p=>`${sx(p[0]).toFixed(1)},${sy(p[1]).toFixed(1)}`).join(' ');
    svg+=`<polyline class="rtrail" data-i="${i}" points="${pts}" fill="none" stroke="${qcol[s.quadrant]}" stroke-width="1.6" opacity="0"/>`; });
  // current dots + labels (tappable)
  secs.forEach((s,i)=>{ const last=s.trail[s.trail.length-1]; const X=sx(last[0]), Y=sy(last[1]);
    svg+=`<circle cx="${X.toFixed(1)}" cy="${Y.toFixed(1)}" r="4" fill="${qcol[s.quadrant]}" style="cursor:pointer" onclick="rrgTog(${i})"/>`;
    svg+=`<text x="${(X+6).toFixed(1)}" y="${(Y+3).toFixed(1)}" font-size="8" fill="#8A91A0" style="cursor:pointer" onclick="rrgTog(${i})">${s.name.slice(0,9)}</text>`; });
  svg+=`</svg>`;
  const rows=secs.map(s=>`<div class="rrgrow"><span class="qdot" style="background:${qcol[s.quadrant]}"></span><b>${s.name}</b><span class="rq">${s.quadrant}</span><span class="rr">RS ${s.rs_ratio}</span></div>`).join('');
  return `<div class="lead">Each dot is a sector measured against ${rrg.benchmark}. <b>100 = moving in line with the market</b> \u2014 right of centre = stronger, above centre = gaining momentum. Tap any dot to trace its last ${rrg.trail_weeks} weeks.</div><div class="rrgwrap">${svg}</div><div class="rrglist">${rows}</div>`;
}

function render(macro,sect,st2){
  const upd=macro?.generated_at||sect?.generated_at||st2?.generated_at;
  document.getElementById('updated').textContent=upd?`updated ${fmtDate(upd)}`:'no data yet';
  const scn=st2?.scanners||{};

  // summary
  let sum='';
  if(macro) sum+=`<span class="k">Backdrop</span> <b class="${macro.verdict.cls}">${macro.verdict.label}</b> `;
  if(sect){ sum+=`&nbsp;·&nbsp; <span class="k">Regime</span> <b class="${sect.regime.cls}">${sect.regime.verdict}</b>`;
    sum+=`<br><span class="k">Leaders</span> <b>${sect.sectors.slice(0,3).map(x=>x.name).join(', ')}</b>`; }
  if(scn.trading) sum+=` &nbsp;·&nbsp; <span class="k">Buy list</span> <b>${scn.trading.qualified} names</b>`;

  // MACRO panel
  let macroHtml='<div class="miss">Macro data unavailable.</div>';
  if(macro){ const v=macro.verdict;
    const assets=macro.signals.filter(x=>x.name!=='Market Breadth');
    const breadth=macro.signals.find(x=>x.name==='Market Breadth');
    macroHtml=`<div class="verdict ${v.cls}"><div class="bar"></div><div class="body"><div class="label">Should I be in equities?</div><div class="big">${v.label}</div><div class="action">${v.action}</div></div></div>`
      +assets.map(sigCard).join('')+(breadth?`<div class="shead" style="font-size:15px;margin-top:20px">Market breadth</div>`+sigCard(breadth):'');
  }

  // SECTORS panel
  let sectHtml='<div class="miss">Sector data unavailable.</div>';
  if(sect){ const rg=sect.regime;
    const maTxt=`${rg.trend_up?'above':'below'} 30-wk MA (${rg.pct_vs_ma>=0?'+':''}${rg.pct_vs_ma}%)`;
    const vixTxt=rg.vix!=null?`${rg.vix} · ${rg.vix_band}`:'n/a';
    const maxAbs=Math.max(...sect.sectors.map(x=>Math.abs(x.blend)),0.5);
    const rows=sect.sectors.map(x=>{const cls=x.tag==='OVERWEIGHT'?'ow':x.tag==='AVOID'?'av':'';const tc=x.tag==='OVERWEIGHT'?'ow':x.tag==='AVOID'?'av':x.tag==='WATCH'?'watch':'';const ar=x.arrow==='up'?'▲':x.arrow==='down'?'▼':'→';const w=Math.round(Math.abs(x.blend)/maxAbs*100);const z=v=>(v>=0?'+':'')+v.toFixed(2);
      return `<div class="row ${cls}"><div class="rank">${String(x.rank).padStart(2,'0')}</div><div><div class="rname">${x.name} <span class="arrow ${x.arrow}">${ar}</span> ${x.proxy?'<span class="px">etf</span>':''}</div><div class="track"><div class="fill" style="width:${w}%"></div></div><div class="zr"><b>L</b> ${z(x.level_z)} <b>M</b> ${z(x.mom_z)} <b>blend</b> ${z(x.blend)}</div></div><div class="tag ${tc}">${x.tag}</div></div>`;}).join('');
    sectHtml=`<div class="verdict ${rg.cls}"><div class="bar"></div><div class="body"><div class="label">Market regime</div><div class="big">${rg.verdict}</div><div class="meta"><div>Nifty <b>${maTxt}</b></div><div>VIX <b>${vixTxt}</b></div></div><div class="action">${rg.note}</div></div></div><div class="lead">Sectors ranked by relative strength vs Nifty 50 (level + momentum):</div>${rows}`;
  }

  // OVERVIEW donuts from Trading scanner
  let ovHtml='<div class="miss">Charts appear once the buy list is loaded.</div>';
  const tr=scn.trading;
  if(tr && tr.qualified){
    const g=tr.grades||{}, ti=tr.tiers||{}, sm=tr.sector_mix||{};
    const PAL=['#5B8DEF','#3FD69A','#EBB94D','#F1766B','#A78BFA','#38BDF8','#FB923C','#F472B6','#818CF8','#FBBF24','#4ADE80','#22D3EE','#E879F9','#94A3B8','#FCA5A5','#FDBA74'];
    let dd='';
    if(g.Prime!=null) dd+=`<div class="donutcard"><h3>Grade mix</h3>${donut([{label:'Prime',value:g.Prime,color:'#3FD69A'},{label:'Healthy',value:g.Healthy,color:'#EBB94D'},{label:'Late',value:g.Late,color:'#F1766B'}])}</div>`;
    if(ti.Large!=null) dd+=`<div class="donutcard"><h3>Market-cap mix</h3>${donut([{label:'Large',value:ti.Large,color:'#5B8DEF'},{label:'Mid',value:ti.Mid,color:'#3FD69A'},{label:'Small',value:ti.Small,color:'#EBB94D'},{label:'Micro',value:ti.Micro||0,color:'#F1766B'}])}</div>`;
    const se=Object.entries(sm).sort((a,b)=>b[1]-a[1]);
    let secD=se.length?`<div class="donutcard" style="min-width:100%"><h3>Sector leadership</h3>${donut(se.map(([label,value],i)=>({label,value,color:PAL[i%PAL.length]})))}</div>`:'';
    ovHtml=`<div class="lead">Snapshot of this week's buy list.</div><div class="dwrap">${dd}${secD}</div>`;
  }

  // build scanner tabs dynamically
  const order=['trading','accumulation','kissing','momentum'];
  const startHtml=`
    <div class="introhero"><div class="ih-title">What is this?</div>
    <p>A weekly compass for Indian stocks. It walks you through three questions, in order, so you never buy blind.</p></div>
    <div class="step"><span class="stepn">1</span><div><b>Should I be buying at all?</b><p>The <em>Macro</em> tab reads the market's overall mood — risk-on or risk-off — so you know if it's a green light or a time to be careful.</p></div></div>
    <div class="step"><span class="stepn">2</span><div><b>Which parts of the market are strong?</b><p>The <em>Sectors</em> and <em>RRG</em> tabs show which areas are leading and which are fading. Fish where the fish are.</p></div></div>
    <div class="step"><span class="stepn">3</span><div><b>Which stocks — and where do I exit?</b><p>The <em>Trading</em> tab is the buy list: strong stocks near support, each with a clear stop-loss. This is the part you act on.</p></div></div>
    <div class="introhd">The golden rules</div>
    <div class="rule">\u2705 <b>Buy strength near support</b> — never chase a stock that has already shot up.</div>
    <div class="rule">\ud83d\uded1 <b>Know your exit before you enter</b> — every stock shows stop-loss levels; pick one.</div>
    <div class="rule">\ud83d\udcc9 <b>The hard exit:</b> if a stock closes below its 150-day line at week's end, you're out — no debate.</div>
    <div class="rule">\ud83d\uddd3\ufe0f <b>Think in weeks, not minutes</b> — check once a week. Only exits deserve daily attention.</div>
    <div class="introhd">How to read a stock</div>
    <div class="rcard">
      <p><b>Grade</b> (Prime / Healthy) — how clean the entry is. Prime is freshest, best risk vs reward.</p>
      <p><b>Three stop-losses</b> (Tight / Medium / Wide) — your safety net. Pick the one that matches your comfort: wider gives more room but a bigger loss if wrong.</p>
      <p><b>\ud83d\udca1 line</b> — the plain-English reason the company is interesting.</p></div>
    <div class="introhd">The other tabs</div>
    <div class="rule"><b>Momentum</b> — stocks running hard right now (more aggressive).</div>
    <div class="rule"><b>Tracker</b> — how long each name has held up, and its return since it appeared.</div>
    <div class="rule"><b>Overview</b> — a quick visual snapshot of grade, size and sector mix.</div>
    <div class="introfoot">Educational tool, not advice. Not SEBI-registered. Always do your own research and manage your own risk.</div>`;
  let tabBtns=`<button data-t="start" class="active">Start here</button><button data-t="ov">Overview</button><button data-t="macro">Macro</button><button data-t="sect">Sectors</button>`;
  let panels=`<div class="panel active" id="p-start">${startHtml}</div>
    <div class="panel" id="p-ov">${ovHtml}</div>
    <div class="panel" id="p-macro"><div class="shead">Should I be in equities?</div>${macroHtml}</div>
    <div class="panel" id="p-sect"><div class="shead">Where should I be?</div>${sectHtml}</div>`;
  if(sect && sect.rrg && sect.rrg.sectors && sect.rrg.sectors.length){
    tabBtns+=`<button data-t="rrg">RRG</button>`;
    panels+=`<div class="panel" id="p-rrg"><div class="shead">Sector rotation (RRG)</div>${rrgPanel(sect.rrg)}</div>`;
  }
  order.forEach(id=>{ const sc=scn[id]; if(!sc) return;
    const lock=sc.personal?`<span class="lock">🔒</span>`:'';
    tabBtns+=`<button data-t="${id}">${sc.label}${lock}</button>`;
    panels+=`<div class="panel" id="p-${id}"><div class="shead">${sc.label}${sc.personal?`<span class="personal-tag">personal</span>`:''}</div>${scannerPanel(sc)}</div>`;
  });

  const tr2 = st2 && st2.tracker;
  if(tr2){ tabBtns+=`<button data-t="tracker">Tracker</button>`; panels+=`<div class="panel" id="p-tracker"><div class="shead">Aging tracker</div>${trackerPanel(tr2)}</div>`; }
  document.getElementById('app').innerHTML=`<div class="summary">${sum||'No data yet — run the build.'}</div><div class="tabs">${tabBtns}</div>${panels}`;

  document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));
    b.classList.add('active'); document.getElementById('p-'+b.dataset.t).classList.add('active');
    window.scrollTo({top:0,behavior:'smooth'});
  });
  document.querySelectorAll('.riskInput').forEach(ri=>ri.oninput=()=>{
    const risk=parseFloat(ri.value);
    document.querySelectorAll('.riskInput').forEach(o=>{if(o!==ri) o.value=ri.value;});
    document.querySelectorAll('.qty').forEach(q=>{const rps=parseFloat(q.dataset.rps); q.textContent=(risk>0&&rps>0)?' · qty '+Math.floor(risk/rps):'';});
  });
}
window.rrgTog=function(i){document.querySelectorAll('.rtrail[data-i="'+i+'"]').forEach(t=>{const on=t.getAttribute('opacity')==='0'||!t.style.opacity&&t.getAttribute('opacity')!=='0.75'; t.style.opacity=(t.style.opacity==='0.75')?'0':'0.75';});};
load();
</script>
</body>
</html>
